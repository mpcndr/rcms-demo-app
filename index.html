<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RCMS — Interactive Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#10233F; --ink2:#2A3F5F; --muted:#6B7A90;
  --line:#DDE3EC; --soft:#EDF1F6; --paper:#F5F7FA; --white:#fff;
  --gold:#B8892B; --goldbg:#FBF3E0; --goldline:#EBD9AE;
  --ok:#1B6E45; --okbg:#E7F2EC; --warn:#B06A05; --warnbg:#FCF1DF;
  --bad:#B03127; --badbg:#FBEAE8; --idle:#5E6B7E; --idlebg:#EEF1F5;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans Thai',system-ui,sans-serif;background:#0B1626;color:var(--ink);-webkit-font-smoothing:antialiased}
.num{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
button{font-family:inherit}

/* demo toolbar */
.bar{position:sticky;top:0;z-index:200;background:#0B1626;border-bottom:1px solid #1E3050;
  padding:9px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.bar .bd{color:#fff;font-size:13px;font-weight:600}
.bar .bd span{color:var(--gold)}
.roles{display:flex;gap:3px;background:#132441;padding:3px;border-radius:6px}
.roles button{background:none;border:0;color:#9BAAC1;font-size:11.5px;padding:5px 11px;border-radius:4px;cursor:pointer}
.roles button.on{background:var(--gold);color:#20160A;font-weight:600}
.bar .tools{margin-left:auto;display:flex;gap:7px;align-items:center}
.bar .tools button{background:transparent;border:1px solid #24395C;color:#9BAAC1;font-size:11px;
  padding:5px 10px;border-radius:5px;cursor:pointer}
.bar .tools button:hover{border-color:#3A567F;color:#fff}
.bar .tools .badge{background:var(--bad);color:#fff;border-radius:9px;padding:0 5px;font-size:10px;margin-left:5px}

.stage{padding:18px;display:flex;justify-content:center}
.frame{width:100%;max-width:1180px;background:var(--paper);border-radius:10px;overflow:hidden;
  box-shadow:0 18px 50px rgba(0,0,0,.45)}

/* app */
.app{display:flex;min-height:680px}
.side{width:214px;flex:0 0 214px;background:var(--ink);color:#C3CEDE;padding:14px 10px;transition:.18s}
.app.mini .side{width:60px;flex:0 0 60px}
.app.mini .side .lbl,.app.mini .side .sect{display:none}
.sh{display:flex;align-items:center;gap:9px;padding:2px 6px 14px}
.burger{width:30px;height:30px;flex:0 0 30px;border:0;border-radius:5px;background:#1B3054;color:#DCE5F0;
  cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center}
.burger:hover{background:#254070}
.sh .lbl{font-size:13.5px;font-weight:600;color:#fff;white-space:nowrap}
.sh .lbl i{display:block;font-style:normal;font-size:9.5px;color:#7D93B3;font-weight:400;letter-spacing:.05em}
.sect{font-size:9.5px;color:#61789B;letter-spacing:.1em;padding:11px 8px 5px;font-weight:500}
.mi{display:flex;align-items:center;gap:10px;padding:8px;border-radius:5px;font-size:12.5px;
  cursor:pointer;white-space:nowrap;color:#B7C4D6}
.mi:hover{background:#1B3054;color:#fff}
.mi.on{background:var(--gold);color:#20160A;font-weight:600}
.mi .ic{width:17px;flex:0 0 17px;text-align:center;font-size:14px}
.mi .cnt{margin-left:auto;background:var(--bad);color:#fff;border-radius:9px;padding:0 6px;font-size:10px}
.mi.on .cnt{background:#20160A;color:var(--gold)}

.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--paper)}
.top{background:var(--white);border-bottom:1px solid var(--line);padding:11px 20px;display:flex;align-items:center;gap:14px}
.crumb{font-size:11px;color:var(--muted);cursor:pointer}
.crumb:hover{color:var(--gold)}
.title{font-size:16px;font-weight:600;letter-spacing:-.01em}
.top .rt{margin-left:auto;display:flex;align-items:center;gap:11px}
.lang{display:flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;font-size:11px}
.lang span{padding:4px 9px;cursor:pointer;color:var(--muted)}
.lang span.on{background:var(--ink);color:#fff}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--goldbg);color:var(--gold);font-size:10px;
  font-weight:600;display:flex;align-items:center;justify-content:center;border:1px solid var(--goldline)}
.body{padding:18px 20px 26px;flex:1}

/* bits */
.alert{background:var(--badbg);border:1px solid #F0CBC6;border-left:3px solid var(--bad);border-radius:6px;
  padding:10px 13px;display:flex;align-items:center;gap:11px;margin-bottom:15px}
.alert .t{font-size:12.5px;color:var(--bad);font-weight:600}
.alert .s{font-size:11.5px;color:#8A4C45}
.alert button{margin-left:auto;background:var(--bad);color:#fff;border:0;border-radius:5px;padding:6px 11px;font-size:11.5px;cursor:pointer}
.filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.sel,.inp{background:var(--white);border:1px solid var(--line);border-radius:5px;padding:6px 11px;
  font-size:11.5px;color:var(--ink2);font-family:inherit}
.sel{cursor:pointer;min-width:130px} .inp{min-width:0;flex:0 1 250px}
select.sel{min-width:150px;height:31px;min-width:0;flex:0 1 170px}
.sel:focus,.inp:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 2px rgba(184,137,43,.14)}
.inp:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 2px rgba(184,137,43,.14)}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:15px}
.kpi{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:13px 14px;position:relative;
  overflow:hidden;cursor:pointer;transition:.15s}
.kpi:hover{border-color:var(--gold);transform:translateY(-1px)}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--idle)}
.kpi.ok:before{background:var(--ok)} .kpi.warn:before{background:var(--warn)} .kpi.bad:before{background:var(--bad)}
.kpi .k{font-size:11.5px;color:var(--muted);margin-bottom:7px}
.kpi .v{font-size:25px;font-weight:600;letter-spacing:-.03em;transition:color .3s}
.kpi.ok .v{color:var(--ok)} .kpi.warn .v{color:var(--warn)} .kpi.bad .v{color:var(--bad)}
.kpi .d{font-size:10.5px;color:var(--muted);margin-top:4px}
@keyframes flash{0%{background:var(--goldbg)}100%{background:var(--white)}}
.flash{animation:flash 1.4s ease-out}

.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:12px;margin-bottom:13px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:13px}
.legend b{font-weight:600;color:var(--ink)}
.card{background:var(--white);border:1px solid var(--line);border-radius:8px}
.card .h{padding:12px 15px 0;display:flex;align-items:baseline;gap:10px}
.card .h h3{font-size:12.5px;font-weight:600}
.card .h .more{margin-left:auto;font-size:11px;color:var(--gold);cursor:pointer}
.card .c{padding:13px 15px 15px}
.money{display:flex;gap:20px;margin-bottom:13px;flex-wrap:wrap}
.money .l{font-size:11px;color:var(--muted);margin-bottom:3px}
.money .n{font-size:19px;font-weight:600;letter-spacing:-.02em}
.money .u{font-size:11px;color:var(--muted);font-weight:400;margin-left:3px}
.pbar{display:flex;height:9px;border-radius:5px;overflow:hidden;margin-bottom:9px}
.pbar div{transition:width .5s}
.legend{display:flex;flex-wrap:wrap;gap:11px;font-size:10.5px;color:var(--ink2)}
.legend i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:5px}

table{width:100%;border-collapse:collapse;font-size:11.5px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:10.5px;padding:8px 10px;
  background:var(--soft);border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--soft);color:var(--ink2)}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:#FAFBFD}
.r{text-align:right}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600}
.pill i{font-style:normal;font-size:8.5px;opacity:.6;margin-left:5px;font-weight:500;letter-spacing:.03em}
.p-ok{background:var(--okbg);color:var(--ok)} .p-warn{background:var(--warnbg);color:var(--warn)}
.p-bad{background:var(--badbg);color:var(--bad)} .p-idle{background:var(--idlebg);color:var(--idle)}
.p-rev{background:#E8EEFA;color:#2B4E9B}
.co{font-weight:500;color:var(--ink)}
.co small{display:block;color:var(--muted);font-weight:400;font-size:10px;margin-top:1px}
.empty{padding:34px;text-align:center;color:var(--muted);font-size:12px}
.empty b{display:block;color:var(--ink2);font-size:13px;margin-bottom:5px}

/* capital clock */
.clock{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:15px 17px;margin-bottom:12px}
.clock .ch{display:flex;align-items:baseline;gap:10px;margin-bottom:16px}
.clock h3{font-size:12.5px;font-weight:600}
.law{font-size:10.5px;color:var(--gold);background:var(--goldbg);padding:2px 8px;border-radius:3px;border:1px solid var(--goldline)}
.track{position:relative;height:36px;margin:0 6px 4px}
.rail{position:absolute;left:0;right:0;top:13px;height:7px;background:var(--soft);border-radius:4px}
.fill{position:absolute;left:0;top:13px;height:7px;border-radius:4px;background:linear-gradient(90deg,#1B6E45,#4E9E75);transition:width .6s}
.tick{position:absolute;top:0;transform:translateX(-50%);text-align:center}
.tick .dot{width:11px;height:11px;border-radius:50%;background:#fff;border:2.5px solid var(--line);margin:11px auto 0}
.tick.done .dot{background:var(--ok);border-color:var(--ok)}
.tick.due .dot{border-color:var(--bad)}
.tick .lb{font-size:9.5px;color:var(--muted);margin-top:3px;white-space:nowrap}
.tick.due .lb{color:var(--bad);font-weight:600}
.insts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.inst{border:1px solid var(--line);border-radius:6px;padding:11px 13px}
.inst.paid{background:#F7FBF8;border-color:#CFE5D9}
.inst .n{font-size:10.5px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.inst .a{font-size:16px;font-weight:600;letter-spacing:-.02em}
.inst .meta{font-size:10.5px;color:var(--muted);margin-top:5px;line-height:1.6}

.btn{background:var(--ink);color:#fff;border:0;border-radius:5px;padding:8px 14px;font-size:12px;cursor:pointer}
.btn:hover{background:var(--ink2)}
.btn.gold{background:var(--gold);color:#20160A;font-weight:600}
.btn.gold:hover{background:#A67A22}
.btn.ghost{background:var(--white);border:1px solid var(--line);color:var(--ink2)}
.btn.ghost:hover{background:var(--soft)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.split{display:grid;grid-template-columns:1fr 320px;gap:12px}
.kv{font-size:11.5px}
.kv>div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--soft)}
.kv>div:last-child{border:0}
.kv .k{color:var(--muted)} .kv .v{font-weight:500;text-align:right}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tab{padding:8px 13px;font-size:12px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
.tab:hover{color:var(--ink2)}
.tab.on{color:var(--ink);border-bottom-color:var(--gold);font-weight:600}

.radio{display:flex;gap:9px;margin-bottom:14px}
.opt{flex:1;border:1px solid var(--line);border-radius:7px;padding:12px 13px;cursor:pointer;background:var(--white)}
.opt:hover{border-color:var(--goldline)}
.opt.on{border-color:var(--gold);background:var(--goldbg);box-shadow:0 0 0 2px rgba(184,137,43,.14)}
.opt .t{font-size:12.5px;font-weight:600;margin-bottom:4px}
.opt .s{font-size:11px;color:var(--muted);line-height:1.6}
.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}
.field{margin-bottom:13px;min-width:0}
.field input,.field select{width:100%;min-width:0;background:var(--white);border:1px solid var(--line);border-radius:5px;
  padding:9px 11px;font-size:12.5px;font-family:inherit;color:var(--ink)}
.field input:focus,.field select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 2px rgba(184,137,43,.14)}
.field input.big{font-size:17px;font-weight:600;font-family:'IBM Plex Mono',monospace}
.hint{font-size:10.5px;color:var(--muted);margin-top:5px}
.hint.err{color:var(--bad)}
.drop{border:1.5px dashed var(--line);border-radius:7px;padding:18px;text-align:center;color:var(--muted);
  font-size:11.5px;background:var(--white);cursor:pointer}
.drop:hover{border-color:var(--gold);background:var(--goldbg)}
.drop b{display:block;color:var(--ink2);font-size:12.5px;margin-bottom:3px}
.files{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:var(--soft);border:1px solid var(--line);border-radius:4px;padding:4px 9px;font-size:10.5px;color:var(--ink2)}
.chip b{color:var(--ok);margin-right:4px}
.audit{background:var(--soft);border-radius:6px;padding:11px 13px;font-size:10.5px;color:var(--muted);line-height:1.7;margin-top:12px}
.audit b{color:var(--ink2)}

.steps{display:flex;gap:0;margin-bottom:14px}
.st{flex:1;padding:9px 11px;background:var(--white);border:1px solid var(--line);font-size:11px;color:var(--muted);position:relative}
.st:first-child{border-radius:6px 0 0 6px} .st:last-child{border-radius:0 6px 6px 0}
.st+.st{border-left:0}
.st.done{background:var(--okbg);border-color:#CFE5D9;color:var(--ok);font-weight:600}
.st.now{background:var(--goldbg);border-color:var(--goldline);color:var(--gold);font-weight:600}
.st b{display:block;font-size:9.5px;opacity:.75;font-weight:500}

/* modal */
.veil{position:fixed;inset:0;background:rgba(8,18,34,.62);display:flex;align-items:center;justify-content:center;
  z-index:300;padding:20px}
.modal{background:var(--white);border-radius:10px;width:100%;max-width:420px;padding:24px;box-shadow:0 22px 60px rgba(0,0,0,.4)}
.modal h3{font-size:16px;font-weight:600;margin-bottom:5px}
.modal p{font-size:12px;color:var(--muted);margin-bottom:18px;line-height:1.7}
.otp{display:flex;gap:7px;margin-bottom:8px}
.otp input{flex:1 1 0;min-width:0;width:100%;height:46px;border:1px solid var(--line);border-radius:6px;text-align:center;
  font-size:19px;font-weight:600;font-family:'IBM Plex Mono',monospace;color:var(--ink);padding:0}
.otp input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 2px rgba(184,137,43,.14)}
.sig{border:1px solid var(--line);border-radius:7px;padding:13px;background:var(--soft);margin-bottom:16px}
.sig .nm{font-family:'IBM Plex Mono',monospace;font-size:15px;color:var(--ink);letter-spacing:.04em}
.sig .mt{font-size:10px;color:var(--muted);margin-top:5px;line-height:1.6}

/* toast */
.toasts{position:fixed;right:18px;bottom:18px;z-index:400;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--ink);color:#fff;border-radius:7px;padding:11px 15px;font-size:12px;max-width:330px;
  box-shadow:0 10px 26px rgba(0,0,0,.35);border-left:3px solid var(--gold);animation:slide .25s ease-out}
.toast b{display:block;margin-bottom:2px}
.toast.ok{border-left-color:#4E9E75}
.toast small{color:#A9B8CD;font-size:10.5px;line-height:1.6;display:block;margin-top:3px}
@keyframes slide{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}

/* login */
.login{display:grid;grid-template-columns:1.15fr 1fr;min-height:680px}
.login .lf{background:var(--ink);color:#fff;padding:50px 44px;display:flex;flex-direction:column}
.seal{width:44px;height:44px;border-radius:50%;border:2px solid var(--gold);color:var(--gold);
  display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;margin-bottom:24px}
.login h1{font-size:28px;font-weight:600;line-height:1.28;letter-spacing:-.02em;margin-bottom:12px}
.login h1 span{color:var(--gold)}
.login .sub{font-size:12.5px;color:#9DB0CA;line-height:1.85;max-width:400px}
.login .stat{margin-top:auto;display:flex;gap:32px;padding-top:28px;border-top:1px solid #22385C}
.login .stat .n{font-size:21px;font-weight:600;color:var(--gold)}
.login .stat .l{font-size:10.5px;color:#8397B4;margin-top:3px}
.login .rt2{background:var(--white);padding:50px 44px;display:flex;flex-direction:column;justify-content:center}
.login .rt2 h2{font-size:17px;font-weight:600;margin-bottom:5px}
.login .rt2 p{font-size:12px;color:var(--muted);margin-bottom:22px}
.note{font-size:10.5px;color:var(--muted);line-height:1.7;margin-top:16px;padding-top:14px;border-top:1px solid var(--soft)}

/* phone */
.mstage{display:flex;gap:24px;justify-content:center;align-items:flex-start;padding:32px 20px;background:var(--paper);min-height:680px}
.phone{width:288px;border:9px solid #0F1E33;border-radius:34px;overflow:hidden;background:#fff;box-shadow:0 14px 34px rgba(0,0,0,.22)}
.phone .sb{height:26px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:9.5px}
.phone .hd{background:var(--ink);color:#fff;padding:0 16px 15px}
.phone .hd .n{font-size:10.5px;color:#93A7C4}
.phone .hd .c{font-size:14.5px;font-weight:600;margin-top:2px}
.phone .bd{padding:14px 16px 18px;min-height:330px}
.pcard{border:1px solid var(--line);border-radius:9px;padding:13px;margin-bottom:10px}
.pcard .l{font-size:10.5px;color:var(--muted)}
.pcard .v{font-size:19px;font-weight:600;letter-spacing:-.02em;margin:3px 0 8px}
.prog{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin-bottom:6px}
.prog i{display:block;height:100%;background:var(--warn);transition:width .6s}
.mrow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--soft);font-size:11.5px}
.mnav{display:flex;border-top:1px solid var(--line)}
.mnav div{flex:1;text-align:center;padding:8px 0;font-size:9px;color:var(--muted)}
.mnav div.on{color:var(--gold);font-weight:600}
.mnav .ic{font-size:15px;display:block;margin-bottom:2px}
.plabel{text-align:center;font-size:11.5px;color:var(--muted);margin-top:10px}

@media(max-width:900px){
  .kpis{grid-template-columns:repeat(2,1fr)} .grid2,.grid3,.split,.login{grid-template-columns:1fr}
  .insts,.steps{grid-template-columns:1fr;flex-direction:column}
}
</style>
</head>
<body>

<div class="bar">
  <div class="bd">RCMS <span>· Interactive Prototype</span></div>
  <div class="roles" id="roles"></div>
  <div class="tools">
    <button id="btnMob">มุมมองมือถือ</button>
    <button id="btnReset">รีเซ็ตเดโม</button>
  </div>
</div>

<div class="stage"><div class="frame" id="frame"></div></div>
<div class="toasts" id="toasts"></div>

<script>
/* ================= data ================= */
var BASE={pending:133,partial:311,completed:742,overdue:98};
function seed(){return[
 {id:'ELN-2025-004871',name:'ລາວກະສິກຳພັດທະນາ ຈຳກັດ',type:'บริษัทจำกัด',prov:'ນະຄອນຫຼວງວຽງຈັນ',isic:'0111',

function otpWire(box,cb){
  var ins=box.querySelectorAll('input');
  ins.forEach(function(inp,i){
    inp.oninput=function(){
      inp.value=inp.value.replace(/[^0-9]/g,'');
      if(inp.value&&ins[i+1])ins[i+1].focus();
      cb(Array.prototype.every.call(ins,function(x){return x.value}));
    };
    inp.onkeydown=function(ev){if(ev.key==='Backspace'&&!inp.value&&ins[i-1])ins[i-1].focus()};
  });
  ins[0].focus();
}

function approve(i){
  var t=S.tasks[i],e=t.ent;
  var before=e.status;
  e.paid+=t.amt;e._delta=(e._delta||0)+t.amt;
  e.status=e.paid>=e.cap?'COMPLETED':'PARTIAL';
  if(e.insts[1]){e.insts[1].state='paid';
    e.insts[1].meta='อนุมัติโดย ຫົວໜ້າພະແນກ 04/08/2026 09:52 · ลงลายเซ็นดิจิทัลแล้ว<br>ออกใบรับรองการฝากทุนอัตโนมัติ';}
  e.hist.push({d:'04/08/2026',a:'ตรวจทานโดย Reviewer',m:'—',v:0,u:'ທ. ບຸນມີ · MOIC',f:'—'});
  e.hist.push({d:'04/08/2026',a:'อนุมัติและลงลายเซ็นดิจิทัล',m:'—',v:0,u:'ຫົວໜ້າພະແນກ · Approver',f:'1 ไฟล์'});
  if(before!==e.status){
    var b=before.toLowerCase(),a=e.status.toLowerCase();
    if(S.counts[b]!==undefined)S.counts[b]--;
    if(S.counts[a]!==undefined)S.counts[a]++;
  }
  S.notif.unshift({t:'ทุนจดทะเบียนครบถ้วนแล้ว',
    s:'MOIC อนุมัติการชำระทุนงวดที่ 2 · ใบรับรองการฝากทุนพร้อมดาวน์โหลดแล้ว',c:'var(--ok)'});
  S.tasks.splice(i,1);
  S.view='inbox';S.modal={type:'done',name:e.name,status:stName(e.status)};
  render();
  toast('อนุมัติสำเร็จ · ลงลายเซ็นดิจิทัลแล้ว','สถานะเปลี่ยนเป็น '+e.status+' · แจ้งเตือนผู้ประกอบการแล้ว',true);
}

function go(v){S.view=v;S.mobile=false;render();window.scrollTo({top:0,behavior:'smooth'})}

$('#btnMob').onclick=function(){S.mobile=!S.mobile;if(S.mobile)S.role='owner';else S.role='apb';render()};
$('#btnReset').onclick=function(){reset();toast('รีเซ็ตเดโมแล้ว','เริ่มจากหน้าเข้าสู่ระบบอีกครั้ง')};
reset();
</script>
</body>
</html>
