<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RCMS — Registration and Capital Monitoring System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --m-dark:#08324D; --m:#0F5C8C; --m-light:#5FA3CC; --m-lite:#EAF2F8;
  --ink:#0E2233; --ink2:#33495E; --muted:#6C7F91;
  --line:#DBE3EA; --soft:#EFF3F7; --paper:#F4F7FA; --white:#fff;
  --ok:#1B6E45; --okbg:#E7F2EC; --warn:#B06A05; --warnbg:#FCF1DF;
  --bad:#B03127; --badbg:#FBEAE8; --idle:#5E6B7E; --idlebg:#EEF1F5;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'IBM Plex Sans','Noto Sans Lao',system-ui,sans-serif;background:var(--paper);
  color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
body.lo{font-family:'Noto Sans Lao','IBM Plex Sans',system-ui,sans-serif}
body.lo .app,body.lo .login{line-height:1.7}
.num{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
button{font-family:inherit}
#frame{height:100vh}

/* ---------- app shell : full screen ---------- */
.app{display:flex;height:100vh;overflow:hidden}
.side{width:224px;flex:0 0 224px;background:var(--m-dark);color:#B9CEDD;padding:14px 10px;
  overflow-y:auto;transition:width .18s,flex-basis .18s}
.side::-webkit-scrollbar{width:5px}
.side::-webkit-scrollbar-thumb{background:#1A5476;border-radius:3px}
.app.mini .side{width:62px;flex:0 0 62px}
.app.mini .side .lbl,.app.mini .side .sect,.app.mini .side .brand{display:none}
.sh{display:flex;align-items:center;gap:9px;padding:2px 6px 16px}
.burger{width:32px;height:32px;flex:0 0 32px;border:0;border-radius:6px;background:#12486B;color:#DCE9F2;
  cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center}
.burger:hover{background:#1A5D87}
.brand{font-size:14px;font-weight:600;color:#fff;white-space:nowrap;letter-spacing:.02em}
.brand i{display:block;font-style:normal;font-size:9.5px;color:#7FA3BC;font-weight:400;letter-spacing:.06em}
.sect{font-size:9.5px;color:#6E93AD;letter-spacing:.09em;padding:12px 8px 5px;font-weight:500;text-transform:uppercase}
.mi{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:6px;font-size:12.5px;
  cursor:pointer;white-space:nowrap;color:#B2C6D6;margin-bottom:1px}
.mi:hover{background:#12486B;color:#fff}
.mi.on{background:var(--m);color:#fff;font-weight:600}
.mi .ic{width:18px;flex:0 0 18px;text-align:center;font-size:14px}
.mi .cnt{margin-left:auto;background:var(--bad);color:#fff;border-radius:9px;padding:0 6px;font-size:10px;font-weight:600}
.mi.soon{opacity:.48}

.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.top{background:var(--white);border-bottom:1px solid var(--line);padding:11px 24px;
  display:flex;align-items:center;gap:14px;flex:0 0 auto;z-index:20}
.crumb{font-size:11px;color:var(--muted);cursor:pointer}
.crumb:hover{color:var(--m)}
.title{font-size:16px;font-weight:600;letter-spacing:-.01em}
.top .rt{margin-left:auto;display:flex;align-items:center;gap:12px}
.lang{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;font-size:11px}
.lang span{padding:5px 11px;cursor:pointer;color:var(--muted)}
.lang span:hover{background:var(--m-lite)}
.lang span.on{background:var(--m);color:#fff;font-weight:600}
.bellwrap{position:relative}
.bell{width:32px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  font-size:16px;color:var(--ink2);cursor:pointer;border:1px solid transparent}
.bell:hover{background:var(--m-lite)}
.bell.open{background:var(--m-lite);border-color:#C8DDEC}
.bell b{position:absolute;top:1px;right:1px;background:var(--bad);color:#fff;font-size:8.5px;
  border-radius:8px;padding:0 4px;font-weight:600;line-height:1.5}
.panel{position:absolute;right:0;top:40px;width:344px;background:var(--white);border:1px solid var(--line);
  border-radius:9px;box-shadow:0 14px 40px rgba(8,50,77,.19);z-index:60;overflow:hidden}
.panel .ph{padding:11px 14px;border-bottom:1px solid var(--soft);display:flex;align-items:center;gap:8px}
.panel .ph h4{font-size:12.5px;font-weight:600}
.panel .ph span{margin-left:auto;font-size:10.5px;color:var(--m);cursor:pointer}
.panel .pb{max-height:330px;overflow-y:auto}
.nrow{padding:11px 14px;border-bottom:1px solid var(--soft);display:flex;gap:10px;cursor:pointer}
.nrow:hover{background:var(--m-lite)}
.nrow:last-child{border-bottom:0}
.nrow .dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px;margin-top:5px}
.nrow .nt{font-size:11.5px;font-weight:600;line-height:1.5}
.nrow .ns{font-size:10.5px;color:var(--muted);line-height:1.65;margin-top:2px}
.nrow .nx{font-size:9.5px;color:var(--muted);margin-top:4px}
.avatar{width:31px;height:31px;border-radius:50%;background:var(--m-lite);color:var(--m);font-size:10px;
  font-weight:600;display:flex;align-items:center;justify-content:center;border:1px solid #C8DDEC;cursor:pointer}
.uinfo{text-align:right;font-size:10.5px;line-height:1.45}
.uinfo b{color:var(--ink)} .uinfo span{color:var(--muted)}

.body{padding:20px 24px 32px;flex:1;overflow-y:auto;background:var(--paper)}
.wrap{max-width:1440px;margin:0 auto}

/* ---------- generic ---------- */
.alert{background:var(--badbg);border:1px solid #F0CBC6;border-left:3px solid var(--bad);border-radius:7px;
  padding:11px 14px;display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.alert .t{font-size:12.5px;color:var(--bad);font-weight:600}
.alert .s{font-size:11.5px;color:#8A4C45}
.alert button{margin-left:auto;background:var(--bad);color:#fff;border:0;border-radius:5px;padding:7px 12px;font-size:11.5px;cursor:pointer}
.filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.sel,.inp{background:var(--white);border:1px solid var(--line);border-radius:6px;padding:7px 11px;
  font-size:11.5px;color:var(--ink2);font-family:inherit;min-width:0}
select.sel{cursor:pointer;height:33px;flex:0 1 190px}
.inp{flex:0 1 280px}
.sel:focus,.inp:focus{outline:none;border-color:var(--m);box-shadow:0 0 0 2px rgba(15,92,140,.15)}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi{background:var(--white);border:1px solid var(--line);border-radius:9px;padding:14px 16px;position:relative;overflow:hidden;cursor:pointer;transition:.15s}
.kpi:hover{border-color:var(--m-light);box-shadow:0 3px 14px rgba(15,92,140,.1);transform:translateY(-1px)}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--m-light)}
.kpi.ok:before{background:var(--ok)} .kpi.warn:before{background:var(--warn)} .kpi.bad:before{background:var(--bad)}
.kpi .k{font-size:11.5px;color:var(--muted);margin-bottom:7px}
.kpi .v{font-size:26px;font-weight:600;letter-spacing:-.03em}
.kpi.ok .v{color:var(--ok)} .kpi.warn .v{color:var(--warn)} .kpi.bad .v{color:var(--bad)}
.kpi .d{font-size:10.5px;color:var(--muted);margin-top:4px}
@keyframes flash{0%{background:var(--m-lite)}100%{background:var(--white)}}
.flash{animation:flash 1.5s ease-out}

.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px;align-items:start}
.card{background:var(--white);border:1px solid var(--line);border-radius:9px}
.card .h{padding:13px 16px 0;display:flex;align-items:baseline;gap:10px}
.card .h h3{font-size:12.5px;font-weight:600}
.card .h .more{margin-left:auto;font-size:11px;color:var(--m);cursor:pointer}
.card .c{padding:14px 16px 16px}
.money{display:flex;gap:26px;flex-wrap:wrap}
.money .l{font-size:11px;color:var(--muted);margin-bottom:3px}
.money .n{font-size:20px;font-weight:600;letter-spacing:-.02em}
.money .u{font-size:11px;color:var(--muted);font-weight:400;margin-left:3px}
.capbar{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.capbar .lhs{flex:1 1 380px;min-width:280px}
.capbar .top2{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:9px;flex-wrap:wrap}
.capbar .lbl2{font-size:11px;color:var(--muted)}
.capbar .big{font-size:23px;font-weight:600;letter-spacing:-.03em}
.capbar .big span{font-size:12px;color:var(--muted);font-weight:400;margin-left:4px}
.sbar{display:flex;height:28px;border-radius:7px;overflow:hidden;background:var(--soft);border:1px solid var(--line)}
.sbar i{display:block;height:100%;transition:width .6s}
.sleg{display:flex;gap:22px;margin-top:11px;flex-wrap:wrap}
.sleg .it{font-size:10.5px;color:var(--muted);border-left:3px solid var(--line);padding-left:9px}
.sleg .it b{display:block;font-size:14px;color:var(--ink);font-weight:600;margin-top:2px}
.gauge{text-align:center;flex:0 0 auto}
.gauge .gl{font-size:10.5px;color:var(--muted);margin-top:6px;line-height:1.6;max-width:150px}
.upanel{position:absolute;right:0;top:42px;width:236px;background:var(--white);border:1px solid var(--line);
  border-radius:9px;box-shadow:0 14px 40px rgba(8,50,77,.19);z-index:60;overflow:hidden}
.upanel .uh{padding:13px 15px;border-bottom:1px solid var(--soft)}
.upanel .uh .t2{font-size:9.5px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.upanel .uh .n2{font-size:12.5px;font-weight:600;margin-top:4px}
.upanel .uh .r2{font-size:10.5px;color:var(--muted);margin-top:2px}
.upanel .ui{padding:11px 15px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:9px;color:var(--ink2)}
.upanel .ui:hover{background:var(--m-lite)}
.upanel .ui.out{color:var(--bad);border-top:1px solid var(--soft)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:10.5px;color:var(--ink2)}
.legend i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:5px}
.legend b{font-weight:600;color:var(--ink)}

table{width:100%;border-collapse:collapse;font-size:11.5px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:10.5px;padding:9px 11px;background:var(--m-lite);border-bottom:1px solid var(--line)}
td{padding:10px 11px;border-bottom:1px solid var(--soft);color:var(--ink2)}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--m-lite)}
.r{text-align:right}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600;white-space:nowrap}
.pill i{font-style:normal;font-size:8.5px;opacity:.6;margin-left:5px;font-weight:500}
.p-ok{background:var(--okbg);color:var(--ok)} .p-warn{background:var(--warnbg);color:var(--warn)}
.p-bad{background:var(--badbg);color:var(--bad)} .p-idle{background:var(--idlebg);color:var(--idle)}
.p-rev{background:var(--m-lite);color:var(--m)}
.co{font-weight:500;color:var(--ink)}
.co small{display:block;color:var(--muted);font-weight:400;font-size:10px;margin-top:1px}
.empty{padding:44px;text-align:center;color:var(--muted);font-size:12px}
.empty b{display:block;color:var(--ink2);font-size:13px;margin-bottom:5px}

.clock{background:var(--white);border:1px solid var(--line);border-radius:9px;padding:16px 18px;margin-bottom:12px}
.clock .ch{display:flex;align-items:baseline;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.clock h3{font-size:12.5px;font-weight:600}
.law{font-size:10.5px;color:var(--m);background:var(--m-lite);padding:3px 9px;border-radius:4px;border:1px solid #C8DDEC}
.track{position:relative;height:40px;margin:0 10px 4px}
.rail{position:absolute;left:0;right:0;top:15px;height:7px;background:var(--soft);border-radius:4px}
.fill{position:absolute;left:0;top:15px;height:7px;border-radius:4px;background:linear-gradient(90deg,var(--ok),#4E9E75);transition:width .6s}
.tick{position:absolute;top:0;transform:translateX(-50%);text-align:center}
.tick .dot{width:12px;height:12px;border-radius:50%;background:#fff;border:2.5px solid var(--line);margin:12px auto 0}
.tick.done .dot{background:var(--ok);border-color:var(--ok)}
.tick.due .dot{border-color:var(--bad)}
.tick.now .dot{background:var(--m);border-color:var(--m)}
.tick .lb{font-size:9.5px;color:var(--muted);margin-top:3px;white-space:nowrap}
.tick.due .lb{color:var(--bad);font-weight:600}
.tick.now .lb{color:var(--m);font-weight:600}
.insts{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:16px}
.inst{border:1px solid var(--line);border-radius:7px;padding:12px 14px}
.inst.paid{background:#F7FBF8;border-color:#CFE5D9}
.inst .n{font-size:10.5px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.inst .a{font-size:17px;font-weight:600;letter-spacing:-.02em}
.inst .meta{font-size:10.5px;color:var(--muted);margin-top:6px;line-height:1.65}

.btn{background:var(--m);color:#fff;border:0;border-radius:6px;padding:9px 15px;font-size:12px;cursor:pointer}
.btn:hover{background:var(--m-dark)}
.btn.ghost{background:var(--white);border:1px solid var(--line);color:var(--ink2)}
.btn.ghost:hover{background:var(--m-lite);border-color:var(--m-light)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.kv{font-size:11.5px}
.kv>div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--soft)}
.kv>div:last-child{border:0}
.kv .k{color:var(--muted);flex-shrink:0} .kv .v{font-weight:500;text-align:right}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:15px;flex-wrap:wrap}
.tab{padding:9px 14px;font-size:12px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
.tab:hover{color:var(--m)}
.tab.on{color:var(--m);border-bottom-color:var(--m);font-weight:600}
.steps{display:flex}
.st{flex:1;padding:10px 12px;background:var(--white);border:1px solid var(--line);font-size:11px;color:var(--muted)}
.st:first-child{border-radius:7px 0 0 7px} .st:last-child{border-radius:0 7px 7px 0}
.st+.st{border-left:0}
.st.done{background:var(--okbg);border-color:#CFE5D9;color:var(--ok);font-weight:600}
.st.now{background:var(--m-lite);border-color:#C8DDEC;color:var(--m);font-weight:600}
.st b{display:block;font-size:9.5px;opacity:.75;font-weight:500}

.radio{display:flex;gap:10px;margin-bottom:15px}
.opt{flex:1;border:1px solid var(--line);border-radius:8px;padding:13px 14px;cursor:pointer;background:var(--white)}
.opt:hover{border-color:var(--m-light)}
.opt.on{border-color:var(--m);background:var(--m-lite);box-shadow:0 0 0 2px rgba(15,92,140,.13)}
.opt .t{font-size:12.5px;font-weight:600;margin-bottom:4px}
.opt .s{font-size:11px;color:var(--muted);line-height:1.6}
.field{margin-bottom:14px;min-width:0}
.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}
.field input,.field select{width:100%;min-width:0;background:var(--white);border:1px solid var(--line);
  border-radius:6px;padding:10px 12px;font-size:12.5px;font-family:inherit;color:var(--ink)}
.field input:focus,.field select:focus{outline:none;border-color:var(--m);box-shadow:0 0 0 2px rgba(15,92,140,.15)}
.field input.big{font-size:18px;font-weight:600;font-family:'IBM Plex Mono',monospace}
.hint{font-size:10.5px;color:var(--muted);margin-top:5px}
.hint.err{color:var(--bad)}
.drop{border:1.5px dashed var(--line);border-radius:8px;padding:20px;text-align:center;color:var(--muted);font-size:11.5px;background:var(--white);cursor:pointer}
.drop:hover{border-color:var(--m);background:var(--m-lite)}
.drop b{display:block;color:var(--ink2);font-size:12.5px;margin-bottom:3px}
.files{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:var(--m-lite);border:1px solid #C8DDEC;border-radius:5px;padding:5px 10px;font-size:10.5px;color:var(--ink2)}
.chip b{color:var(--ok);margin-right:4px}
.audit{background:var(--soft);border-radius:7px;padding:12px 14px;font-size:10.5px;color:var(--muted);line-height:1.7;margin-top:13px}
.audit b{color:var(--ink2)}

.veil{position:fixed;inset:0;background:rgba(6,26,42,.66);display:flex;align-items:center;justify-content:center;z-index:300;padding:20px}
.modal{background:var(--white);border-radius:11px;width:100%;max-width:440px;padding:26px;box-shadow:0 22px 60px rgba(0,0,0,.4);max-height:90vh;overflow-y:auto}
.modal h3{font-size:16px;font-weight:600;margin-bottom:5px}
.modal p{font-size:12px;color:var(--muted);margin-bottom:18px;line-height:1.7}
.otp{display:flex;gap:8px;margin-bottom:8px}
.otp input{flex:1 1 0;min-width:0;width:100%;height:48px;padding:0;border:1px solid var(--line);border-radius:7px;
  text-align:center;font-size:20px;font-weight:600;font-family:'IBM Plex Mono',monospace;color:var(--ink)}
.otp input:focus{outline:none;border-color:var(--m);box-shadow:0 0 0 2px rgba(15,92,140,.15)}
.sig{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--soft);margin-bottom:16px}
.sig .nm{font-family:'IBM Plex Mono',monospace;font-size:15px;color:var(--ink);letter-spacing:.04em}
.sig .mt{font-size:10px;color:var(--muted);margin-top:5px;line-height:1.6}
.keys{font-size:11.5px}
.keys>div{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--soft)}
.keys>div:last-child{border:0}
.keys kbd{font-family:'IBM Plex Mono',monospace;font-size:10.5px;background:var(--soft);border:1px solid var(--line);
  border-bottom-width:2px;border-radius:5px;padding:3px 8px;color:var(--ink2);white-space:nowrap}
.keys span{color:var(--muted)}

.toasts{position:fixed;right:20px;bottom:20px;z-index:400;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--m-dark);color:#fff;border-radius:8px;padding:12px 16px;font-size:12px;max-width:350px;
  box-shadow:0 10px 26px rgba(0,0,0,.35);border-left:3px solid var(--m-light);animation:sl .25s ease-out}
.toast.ok{border-left-color:#4E9E75}
.toast b{display:block;margin-bottom:2px}
.toast small{color:#A9C4D8;font-size:10.5px;line-height:1.6;display:block;margin-top:3px}
@keyframes sl{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}

#tip{position:fixed;z-index:500;background:var(--m-dark);color:#fff;padding:8px 12px;border-radius:7px;
  font-size:11px;pointer-events:none;opacity:0;transition:opacity .12s;box-shadow:0 6px 18px rgba(0,0,0,.3);white-space:nowrap}
#tip b{display:block;font-size:12.5px;margin-bottom:2px}
#tip span{color:#A9C4D8;font-size:10.5px}
.hv{cursor:pointer;transition:opacity .12s}
.hv:hover{opacity:.75}

.login{display:grid;grid-template-columns:1.15fr 1fr;height:100vh;overflow:hidden}
.login .lf{background:var(--m-dark);color:#fff;padding:52px 52px;display:flex;flex-direction:column;overflow-y:auto}
.seal{width:46px;height:46px;border-radius:50%;border:2px solid var(--m-light);color:var(--m-light);
  display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;margin-bottom:24px}
.login h1{font-size:27px;font-weight:600;line-height:1.4;letter-spacing:-.02em;margin-bottom:14px}
.login h1 span{color:var(--m-light)}
.login .sub{font-size:12.5px;color:#9EBCD1;line-height:1.9;max-width:440px}
.login .stat{margin-top:auto;display:flex;gap:34px;padding-top:28px;border-top:1px solid #164B6C;flex-wrap:wrap}
.login .stat .n{font-size:22px;font-weight:600;color:var(--m-light)}

.acct{border:1px solid var(--line);border-radius:9px;padding:11px 13px;margin-bottom:7px;cursor:pointer;

.acct:hover{border-color:var(--m-light);background:var(--m-lite)}
.acct.on{border-color:var(--m);background:var(--m-lite);box-shadow:0 0 0 2px rgba(15,92,140,.13)}

.note{font-size:10.5px;color:var(--muted);line-height:1.7;margin-top:14px;padding-top:13px;border-top:1px solid var(--soft)}

.phone{width:296px;border:10px solid var(--m-dark);border-radius:36px;overflow:hidden;background:#fff;box-shadow:0 16px 38px rgba(0,0,0,.2)}

.phone .hd{background:var(--m-dark);color:#fff;padding:0 17px 16px}
.phone .hd .n{font-size:10.5px;color:#93B4CB}
.phone .hd .c{font-size:14px;font-weight:600;margin-top:2px}
.phone .bd{padding:15px 17px 18px;min-height:352px}

.pcard .l{font-size:10.5px;color:var(--muted)}
.pcard .v{font-size:18px;font-weight:600;letter-spacing:-.02em;margin:3px 0 8px}
.prog{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin-bottom:6px}
.prog i{display:block;height:100%;background:var(--warn);transition:width .6s}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid var(--soft);font-size:11.5px}
.mnav{display:flex;border-top:1px solid var(--line)}

.mnav div.on{color:var(--m);font-weight:600}
.mnav .ic{font-size:15px;display:block;margin-bottom:2px}
.plabel{text-align:center;font-size:11.5px;color:var(--muted);margin-top:11px}

function donut(c){

  var segs=[[c.completed,'#1B6E45','kOk'],[c.partial,'#B06A05','kPart'],

      'stroke-dasharray="'+len.toFixed(1)+' '+(C-len).toFixed(1)+'" stroke-dashoffset="'+(-off).toFixed(1)+'" '+
      'transform="rotate(-90 70 70)" data-tip="'+t(s[2])+'|'+fmt(s[0])+' '+t('items')+' · '+(s[0]/tot*100).toFixed(1)+'%"></circle>';

function lineWide(){
  var mm=MOCK.mth[lang]||MOCK.mth.en,d=MOCK.overdue;
  var W=1000,H=190,PL=44,PR=14,PT=14,max=180,min=80;
  var iw=W-PL-PR,step=iw/(d.length-1);
  var y=function(v){return PT+H-(v-min)/(max-min)*H};
  var grid='',i;
  for(i=min;i<=max;i+=20){
    grid+='<line x1="'+PL+'" y1="'+y(i)+'" x2="'+(W-PR)+'" y2="'+y(i)+'" stroke="#E8EDF2"/>'+
      '<text x="'+(PL-9)+'" y="'+(y(i)+3.5)+'" text-anchor="end" font-size="10" fill="#8896A6" font-family="IBM Plex Mono,monospace">'+i+'</text>'}
  var pts=d.map(function(v,k){return (PL+k*step).toFixed(1)+','+y(v).toFixed(1)}).join(' ');
  var peak=d.indexOf(Math.max.apply(null,d));
  var dots=d.map(function(v,k){var last=k===d.length-1;
    return '<circle class="hv" cx="'+(PL+k*step).toFixed(1)+'" cy="'+y(v).toFixed(1)+'" r="'+(last?6:4.5)+'" '+
    'fill="'+(last?'#B03127':'#0F5C8C')+'" stroke="#fff" stroke-width="2" '+
    'data-tip="'+mm[k]+' '+(k<4?'2025':'2026')+'|'+v+' '+t('items')+'"></circle>'}).join('');
  var lbs=mm.map(function(m,k){return '<text x="'+(PL+k*step).toFixed(1)+'" y="'+(PT+H+18)+'" text-anchor="middle" '+
    'font-size="10" fill="#6C7F91">'+m+'</text>'}).join('');
  var pk='<line x1="'+(PL+peak*step).toFixed(1)+'" y1="'+y(d[peak]).toFixed(1)+'" x2="'+(PL+peak*step).toFixed(1)+
    '" y2="'+(PT+H)+'" stroke="#B03127" stroke-width="1" stroke-dasharray="3 3" opacity=".45"/>'+
    '<text x="'+(PL+peak*step+8).toFixed(1)+'" y="'+(y(d[peak])-9).toFixed(1)+'" font-size="10.5" fill="#B03127" font-weight="600">'+d[peak]+'</text>';
  return '<svg viewBox="0 0 '+W+' '+(H+PT+28)+'" style="width:100%;height:250px">'+grid+
   '<polygon points="'+PL+','+(PT+H)+' '+pts+' '+(W-PR)+','+(PT+H)+'" fill="#EAF2F8"/>'+
   '<polyline points="'+pts+'" fill="none" stroke="#0F5C8C" stroke-width="2.4"/>'+pk+dots+lbs+
   '<text x="'+(W-PR)+'" y="'+(y(d[11])-14).toFixed(1)+'" text-anchor="end" font-size="11" fill="#B03127" font-weight="600">'+d[11]+'</text>'+
   '</svg>';
}

/* ================= render ================= */
function render(){
  document.body.className=(lang==='lo'?'lo':'');
  document.documentElement.lang=lang;
  var h;
  if(S.view==='login')h=vLogin();
  else if(S.mobile)h=vMobile();
  else if(S.view==='dash')h=vDash();
  else if(S.view==='list')h=vList();
  else if(S.view==='detail')h=vDetail();
  else if(S.view==='pay')h=vPay();
  else if(S.view==='inbox')h=vInbox();
  else if(S.view==='task')h=vTask();
  else if(S.view==='val')h=vVal();
  else if(S.view==='cert')h=vCert();
  else if(S.view==='fin')h=vFin();
  else if(S.view==='rep')h=vRep();
  else if(S.view==='set')h=vSet();
  else if(S.view==='bizdash')h=vBizDash();
  else if(S.view==='bizdoc')h=vBizDoc();
  else h=vDash();
  $('#frame').innerHTML=h;
  var v=$('#veil');if(v)v.remove();
  if(S.modal)document.body.insertAdjacentHTML('beforeend',vModal());
  bind();
}
function go(v){S.view=v;S.mobile=false;S.bell=false;S.umenu=false;render()}

function bind(){
  document.querySelectorAll('[data-lang]').forEach(function(b){b.onclick=function(){lang=b.dataset.lang;render()}});
  document.querySelectorAll('[data-nav]').forEach(function(el){el.onclick=function(ev){
    ev.stopPropagation();var v=el.dataset.nav;
    if(v==='x'){toast(t('phase2'),t('phase2S'));return}
    go(v)}});
  document.querySelectorAll('[data-burger]').forEach(function(b){b.onclick=function(){S.mini=!S.mini;render()}});
  document.querySelectorAll('[data-open]').forEach(function(r){r.onclick=function(){S.sel=r.dataset.open;go('detail')}});
  document.querySelectorAll('[data-tab]').forEach(function(b){b.onclick=function(){S.tab=b.dataset.tab;go('list')}});
  document.querySelectorAll('[data-soon]').forEach(function(b){b.onclick=function(ev){
    ev.stopPropagation();toast(b.dataset.soon,t('notDemo'))}});
  document.querySelectorAll('[data-pick]').forEach(function(b){b.onclick=function(){S.pick=b.dataset.pick;render()}});
  document.querySelectorAll('[data-mode]').forEach(function(b){b.onclick=function(){S.form.mode=b.dataset.mode;render()}});
  document.querySelectorAll('[data-set]').forEach(function(b){b.onclick=function(){S.setTab=b.dataset.set;render()}});
  document.querySelectorAll('[data-fin]').forEach(function(b){b.onclick=function(){S.finTab=b.dataset.fin;render()}});
  document.querySelectorAll('[data-copy]').forEach(function(b){b.onclick=function(){S.certCopy=b.dataset.copy==='1';render()}});
  document.querySelectorAll('[data-cert]').forEach(function(b){b.onclick=function(){go('cert')}});
  document.querySelectorAll('[data-close]').forEach(function(b){b.onclick=function(){S.modal=null;render()}});
  document.querySelectorAll('[data-logout]').forEach(function(b){b.onclick=function(){logout()}});
  document.querySelectorAll('[data-bell]').forEach(function(b){b.onclick=function(ev){
    ev.stopPropagation();S.bell=!S.bell;S.umenu=false;render()}});
  document.querySelectorAll('[data-user]').forEach(function(b){b.onclick=function(ev){
    ev.stopPropagation();S.umenu=!S.umenu;S.bell=false;render()}});
  document.querySelectorAll('[data-read]').forEach(function(b){b.onclick=function(ev){
    ev.stopPropagation();S.read=true;render()}});
  document.querySelectorAll('[data-pay]').forEach(function(b){b.onclick=function(){
    var e=S.ents.filter(function(x){return x.id===S.sel})[0];
    S.form={mode:'cash',amt:fmt(e.cap-e.paid),files:[],err:''};go('pay')}});
  document.querySelectorAll('[data-after]').forEach(function(b){b.onclick=function(){
    S.modal=null;S.view=b.dataset.after==='cert'?'cert':'dash';render();
    if(b.dataset.after==='dash')setTimeout(function(){
      document.querySelectorAll('.kpi.ok,.kpi.warn').forEach(function(k){k.classList.add('flash')})},60)}});

  var st=$('#stSel');if(st)st.onchange=function(){S.tab=st.value;render()};
  var q=$('#q');if(q)q.oninput=function(){var p=q.selectionStart;S.q=q.value;render();
    var n=$('#q');if(n){n.focus();n.setSelectionRange(p,p)}};
  var amt=$('#fAmt');if(amt)amt.oninput=function(){S.form.amt=amt.value};
  var dp=$('#drop');if(dp)dp.onclick=function(){
    var ns=['bank-slip-20260804.pdf','confirmation-letter.pdf','deposit-receipt.jpg'];
    if(S.form.files.length<3){S.form.files.push(ns[S.form.files.length]);render()}};

  var sp=$('#submitPay');
  if(sp)sp.onclick=function(){
    var e=S.ents.filter(function(x){return x.id===S.sel})[0];
    if(S.form.sending)return;
    if(pendingOf(e.id)){toast(t('hasPending'),t('hasPendingS'));return go('detail')}
    var v=Number(String(S.form.amt).replace(/[^0-9]/g,''));
    if(!v){S.form.err=t('errAmt');return render()}
    if(v>e.cap-e.paid){S.form.err=t('errOver')+' — '+fmt(e.cap-e.paid);return render()}
    if(!S.form.files.length){S.form.err=t('errFile');return render()}
    if(e.paid===0&&(v/e.cap)<0.3){S.form.err=t('err30')+' ('+fmt(Math.ceil(e.cap*0.3))+')';return render()}
    S.form.sending=true;sp.disabled=true;
    S.tasks.push({ref:'APR-2026-0'+(918+S.tasks.length),ent:e,amt:v,mode:S.form.mode,
      by:'ນ. ສີວິໄລ · APB',at:'09:47',stage:'review',files:S.form.files.slice(),
      trail:[{who:'ນ. ສີວິໄລ · APB (Checker)',act:{lo:'ບັນທຶກ ແລະ ສົ່ງກວດທານ',en:'Recorded and sent for review'},at:'04/08/2026 09:47'}]});
    if(e.insts[1]&&e.insts[1].state!=='paid'){e.insts[1].state='review';
      e.insts[1].meta={lo:'ສົ່ງກວດທານແລ້ວ 04/08/2026 09:47',en:'Sent for review on 04/08/2026 09:47'}}
    e.hist.push({d:'04/08/2026',a:{lo:'ບັນທຶກການຊຳລະທຶນ (ລໍກວດທານ)',en:'Capital payment recorded (pending review)'},
      m:S.form.mode,v:v,u:'ນ. ສີວິໄລ · APB',f:S.form.files.length});
    toast(t('sentReview'),t('sentReviewS'),true);go('detail')};

  document.querySelectorAll('[data-task]').forEach(function(r){r.onclick=function(){
    S.taskI=Number(r.dataset.task);go('task')}});
  document.querySelectorAll('[data-sign]').forEach(function(b){b.onclick=function(){
    S.modal={type:'approve',i:S.taskI};render()}});
  document.querySelectorAll('[data-fwd]').forEach(function(b){b.onclick=function(){
    var x=S.tasks[S.taskI];x.stage='approve';
    x.trail.push({who:'ທ. ບຸນມີ · MOIC (Reviewer)',act:{lo:'ກວດທານແລ້ວ ສົ່ງຕໍ່ຜູ້ອະນຸມັດ',en:'Verified and sent to the approver'},at:'04/08/2026 10:04'});
    toast(t('revDone'),t('revDoneS'),true);go('inbox')}});
  document.querySelectorAll('[data-back]').forEach(function(b){b.onclick=function(){
    var x=S.tasks[S.taskI],e=x.ent;
    if(e.insts[1]){e.insts[1].state='due';e.insts[1].meta={lo:'ຖືກຕີກັບໃຫ້ແກ້ໄຂ 04/08/2026',en:'Returned for correction on 04/08/2026'}}
    e.hist.push({d:'04/08/2026',a:{lo:'ຕີກັບໃຫ້ແກ້ໄຂ',en:'Returned for correction'},m:'',v:0,u:who().n,f:'—'});
    S.tasks.splice(S.taskI,1);toast(t('backDone'),t('backDoneS'));go('inbox')}});

  var o1=$('#otp');if(o1)otpWire(o1,function(f){$('#doLogin').disabled=!f});
  var dl=$('#doLogin');
  if(dl)dl.onclick=function(){
    S.role=S.pick;S.mobile=false;S.read=false;
    S.view=S.role==='owner'?'bizdash':(S.role==='apb'?'dash':'inbox');
    render();toast(t('loggedIn'),who().n+' · '+who().r,true)};
  var o2=$('#otp2');if(o2)otpWire(o2,function(f){$('#doApprove').disabled=!f});
  var da=$('#doApprove');if(da)da.onclick=function(){approve(S.modal.i)};

  var tip=$('#tip');
  document.querySelectorAll('[data-tip]').forEach(function(el){
    el.addEventListener('mousemove',function(ev){
      var p=el.dataset.tip.split('|');
      tip.innerHTML='<b>'+p[0]+'</b><span>'+(p[1]||'')+'</span>';
      tip.style.opacity='1';
      tip.style.left=Math.min(ev.clientX+14,window.innerWidth-210)+'px';
      tip.style.top=Math.max(8,ev.clientY-50)+'px'});
    el.addEventListener('mouseleave',function(){tip.style.opacity='0'})});
}

function otpWire(box,cb){
  var ins=box.querySelectorAll('input');
  ins.forEach(function(inp,i){
    inp.oninput=function(){inp.value=inp.value.replace(/[^0-9]/g,'');
      if(inp.value&&ins[i+1])ins[i+1].focus();
      cb(Array.prototype.every.call(ins,function(x){return x.value}))};
    inp.onkeydown=function(ev){if(ev.key==='Backspace'&&!inp.value&&ins[i-1])ins[i-1].focus()}});
  ins[0].focus();
}

function approve(i){
  var x=S.tasks[i];if(!x)return;
  var e=x.ent,before=e.status;
  e.paid+=x.amt;e._d=(e._d||0)+x.amt;
  e.status=e.paid>=e.cap?'COMPLETED':'PARTIAL';
  if(e.insts[1]){e.insts[1].state='paid';
    e.insts[1].meta={lo:'ອະນຸມັດໂດຍ ຫົວໜ້າພະແນກ 04/08/2026 · ລົງລາຍເຊັນດິຈິຕອນແລ້ວ',
                     en:'Approved by the division head on 04/08/2026 · digitally signed'}}
  e.hist.push({d:'04/08/2026',a:{lo:'ກວດທານໂດຍ Reviewer',en:'Verified by the reviewer'},m:'',v:0,u:'ທ. ບຸນມີ · MOIC',f:'—'});
  e.hist.push({d:'04/08/2026',a:{lo:'ອະນຸມັດ ແລະ ລົງລາຍເຊັນດິຈິຕອນ',en:'Approved and digitally signed'},m:'',v:0,u:'ຫົວໜ້າພະແນກ',f:'1'});
  if(before!==e.status){
    var b=before.toLowerCase(),a=e.status.toLowerCase();
    if(S.counts[b]!==undefined)S.counts[b]--;
    if(S.counts[a]!==undefined)S.counts[a]++}
  S.notif.unshift({t:{lo:'ທຶນຈົດທະບຽນຄົບຖ້ວນແລ້ວ',en:'Registered capital fully paid'},
    s:{lo:'MOIC ອະນຸມັດແລ້ວ · ໃບຢັ້ງຢືນການຝາກທຶນພ້ອມດາວໂຫຼດ',en:'Approved by MOIC · the capital deposit certificate is ready to download'},
    x:'10:12',c:'var(--ok)'});
  S.tasks.splice(i,1);
  S.sel=e.id;S.view='inbox';
  S.modal={type:'done',name:e.name,status:stName(e.status)};
  render();toast(t('apvDone'),t('statusTo')+' '+stName(e.status),true);
}

function logout(){S.role=null;S.view='login';S.mobile=false;S.bell=false;S.umenu=false;S.modal=null;render()}

/* ---------- global handlers ---------- */
document.addEventListener('click',function(ev){
  if((S.bell||S.umenu)&&!ev.target.closest('.bellwrap')){S.bell=false;S.umenu=false;render()}});

document.addEventListener('keydown',function(ev){
  if(ev.key==='Escape'&&(S.modal||S.bell||S.umenu)){S.modal=null;S.bell=false;S.umenu=false;render();return}
  if(!ev.altKey||ev.ctrlKey||ev.metaKey)return;
  var tag=(ev.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='select'||tag==='textarea')return;
  var k=ev.key.toLowerCase();
  if(k==='l'){ev.preventDefault();lang=lang==='lo'?'en':'lo';render()}
  else if(k==='m'){ev.preventDefault();
    if(S.role==='owner'){S.mobile=!S.mobile;render()}else toast(t('kbMob'),'')}
  else if(k==='b'){ev.preventDefault();if(S.role){S.mini=!S.mini;render()}}
  else if(k==='q'){ev.preventDefault();if(S.role)logout()}
  else if(k==='r'){ev.preventDefault();reset();toast(t('resetDone'),t('resetDoneS'))}
  else if(k==='/'||ev.key==='?'){ev.preventDefault();
    S.modal=S.modal&&S.modal.type==='keys'?null:{type:'keys'};render()}
});

reset();
</script>
</body>
</html>
